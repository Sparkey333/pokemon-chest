<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Chest Deck" />
<meta name="theme-color" content="#0a0e16" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="@@ICON@@" />
<title>Pokémon Chest — Deck</title>
<style>
:root{
  --bg:#0a0e16;--bg2:#0e131e;--panel:#141c2b;--panel2:#192335;--panel3:#1f2a40;
  --border:#26334b;--border2:#324360;--text:#e8eef8;--muted:#93a3be;--muted2:#6c7c98;
  --gold:#ffce4d;--ruby:#e0556b;--amber:#e8a33d;--emerald:#3ad6a0;--teal:#2fb6c4;
  --sapphire:#4cc2ff;--amethyst:#a97bff;--violet:#8b7bff;--red:#ff7a7a;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --font:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{background:
  radial-gradient(120% 60% at 80% -10%,rgba(76,194,255,.10),transparent 60%),
  radial-gradient(110% 55% at 5% 5%,rgba(169,123,255,.10),transparent 55%),
  radial-gradient(130% 60% at 50% 110%,rgba(255,206,77,.06),transparent 60%),var(--bg)}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{width:30px;height:30px;flex:0 0 auto}
.top h1{font-size:16px;font-weight:800;letter-spacing:.01em;flex:1}
.top h1 span{color:var(--gold)}
.pf{text-align:right;line-height:1.1}
.pf .l{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.pf .v{font-size:15px;font-weight:800;color:var(--gold)}
.caught-pill{font-size:11px;font-weight:700;color:var(--emerald);background:rgba(58,214,160,.12);border:1px solid var(--emerald);border-radius:20px;padding:3px 9px}

/* views */
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ===== DECK (swipe) ===== */
#deck-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:1400px}
.sw-card{position:absolute;width:74vw;max-width:320px;aspect-ratio:63/88;border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.6);will-change:transform;background:var(--panel3);touch-action:none;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.3,1),opacity .3s}
.sw-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sw-card .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(160deg,var(--panel2),var(--bg2));text-align:center;padding:16px}
.ph .pb{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#e2485f 0 49%,#dfe6f2 51% 100%);opacity:.5;position:relative}
.ph .pb::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);background:#0a0e16}
.ph .pn{font-size:13px;color:var(--muted);line-height:1.35}
.sw-card .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;
  background:linear-gradient(115deg,transparent 30%,rgba(120,190,255,.5),rgba(169,123,255,.35),rgba(255,206,77,.4),transparent 70%);
  background-size:220% 220%;background-position:var(--hx,50%) var(--hy,50%)}
.sw-card .grade-flag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--gold);color:#1e1603}
.sw-card .lang-flag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;background:rgba(10,14,22,.7);color:#fff}
.sw-card.wild{filter:grayscale(.75) brightness(.62)}
.sw-card.wild .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(6,10,18,.42)}
.sw-card.wild .lock .lk{font-size:34px}
.sw-card.wild .lock .lt{font-size:12px;font-weight:800;color:#fff;text-align:center;padding:0 18px;text-shadow:0 2px 8px #000}
.tier-ring{position:absolute;inset:0;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 2.5px var(--tc,transparent),0 0 26px -8px var(--tc,transparent)}
.sw-info{padding:6px 20px 4px;text-align:center;min-height:78px}
.sw-name{font-size:19px;font-weight:800}
.sw-set{font-size:12.5px;color:var(--muted)}
.sw-val{font-size:17px;font-weight:800;color:var(--gold);margin-top:2px}
.sw-tier{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:20px;margin-top:4px;background:var(--tc,#8f9bb3);color:#0a0e16}
.sw-hint{padding:2px 16px 10px;text-align:center;font-size:11.5px;color:var(--muted2)}
.sw-dots{display:flex;gap:5px;justify-content:center;padding-bottom:6px;flex-wrap:wrap;max-height:22px;overflow:hidden}
.sw-dot{width:6px;height:6px;border-radius:50%;background:var(--panel3)}
.sw-dot.on{background:var(--gold);transform:scale(1.3)}

/* ===== BUILD ===== */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px calc(20px + var(--safe-b))}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted2);margin:14px 2px 8px}
.mydeck{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:96px}
.mydeck .slot{flex:0 0 auto;width:58px;aspect-ratio:63/88;border-radius:8px;border:1.5px dashed var(--border2);
  display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:22px;background:var(--panel)}
.mydeck .mini{position:relative;flex:0 0 auto;width:58px;aspect-ratio:63/88;border-radius:8px;overflow:hidden;border:1.5px solid var(--tc,var(--border2))}
.mydeck .mini img{width:100%;height:100%;object-fit:cover}
.mydeck .mini .x{position:absolute;top:1px;right:1px;background:rgba(224,85,107,.9);color:#fff;font-size:10px;font-weight:800;border-radius:5px;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gcard{position:relative;border-radius:10px;overflow:hidden;background:var(--panel3);aspect-ratio:63/88;border:1.5px solid var(--tc,var(--border))}
.gcard img{width:100%;height:100%;object-fit:cover}
.gcard .gv{position:absolute;bottom:0;left:0;right:0;font-size:9.5px;font-weight:700;color:#fff;background:linear-gradient(0deg,rgba(6,10,18,.92),transparent);padding:10px 5px 3px}
.gcard.sel{outline:3px solid var(--emerald);outline-offset:-3px}
.gcard .add{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--emerald);color:#04241a;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.gcard.wildcell{filter:grayscale(.8) brightness(.6)}
.gcard .wl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}

/* ===== BATTLE ===== */
#battle{align-items:center;justify-content:center}
.arena{flex:1;width:100%;position:relative;overflow:hidden;perspective:900px;perspective-origin:50% 42%}
.scene{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s ease}
.stadium{position:absolute;left:50%;top:56%;width:150%;height:120%;transform:translate(-50%,-50%) rotateX(74deg);
  transform-style:preserve-3d;
  background:radial-gradient(ellipse at center,rgba(76,194,255,.22),rgba(169,123,255,.12)45%,transparent 70%);
  border-radius:50%;box-shadow:0 0 90px rgba(76,194,255,.25)}
.stadium::before,.stadium::after{content:"";position:absolute;inset:14% ;border-radius:50%;border:2px solid rgba(120,190,255,.25)}
.stadium::after{inset:30%;border-color:rgba(169,123,255,.28)}
.ring-spin{position:absolute;left:50%;top:56%;width:120%;height:96%;transform:translate(-50%,-50%) rotateX(74deg);border-radius:50%;
  border:2px dashed rgba(255,206,77,.22);animation:ringspin 14s linear infinite}
@keyframes ringspin{to{transform:translate(-50%,-50%) rotateX(74deg) rotate(360deg)}}
.pile{position:absolute;left:50%;width:96px;aspect-ratio:63/88;transform-style:preserve-3d}
.pile .pc{position:absolute;inset:0;border-radius:9px;background:linear-gradient(150deg,#1b2740,#0d1424);
  border:1px solid var(--border2);box-shadow:0 8px 20px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center}
.pile .pc .emblem{width:44%;height:44%;opacity:.9}
.pile.you{bottom:6%;transform:translateX(-50%) translateZ(60px)}
.pile.foe{top:6%;transform:translateX(-50%) translateZ(-40px) rotate(180deg)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,#fff,rgba(120,190,255,.6) 30%,transparent 62%);opacity:0;pointer-events:none}
.bt-title{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:40px;font-weight:900;letter-spacing:.04em;
  color:#fff;text-shadow:0 0 24px var(--sapphire),0 4px 12px #000;opacity:0}
.board{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0}
.board.on{display:flex}
.bcard{width:44vw;max-width:200px;aspect-ratio:63/88;border-radius:14px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6);border:2px solid var(--tc,var(--border2))}
.bcard img{width:100%;height:100%;object-fit:cover}
.bcard .ph{width:100%;height:100%}
.blabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.bmid{text-align:center}
.vs{font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 18px rgba(255,206,77,.5)}
.result{font-size:17px;font-weight:800;margin-top:6px}
.coin{width:78px;height:78px;border-radius:50%;margin:6px auto;background:radial-gradient(circle at 35% 30%,#ffe89a,#d8a72e);
  display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 20px rgba(0,0,0,.5);transform-style:preserve-3d}
.coin.flip{animation:coinflip 1.1s ease-out}
@keyframes coinflip{0%{transform:rotateY(0)}100%{transform:rotateY(1440deg)}}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px;color:var(--muted)}
.empty .big{font-size:46px}
.btn{font-family:inherit;font-weight:800;border:none;border-radius:12px;padding:13px 22px;font-size:15px;
  background:linear-gradient(135deg,var(--gold),#e7af2c);color:#1e1603;box-shadow:0 8px 22px rgba(255,206,77,.25)}
.btn.blue{background:linear-gradient(135deg,#8fd8ff,#4cc2ff);color:#062134;box-shadow:0 8px 22px rgba(76,194,255,.28)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border2);box-shadow:none}
.btn:disabled{opacity:.5}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px}

/* bottom nav */
.nav{display:flex;background:rgba(14,19,30,.94);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.nav button{flex:1;background:none;border:none;color:var(--muted2);font-family:inherit;padding:11px 0 9px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:20px}
.nav button.on{color:#fff}
.nav button.on[data-nav="deck"]{color:var(--gold)}
.nav button.on[data-nav="build"]{color:var(--emerald)}
.nav button.on[data-nav="battle"]{color:var(--sapphire)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <svg class="logo" viewBox="0 0 32 32"><defs><linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd96a"/><stop offset="1" stop-color="#e7af2c"/></linearGradient></defs>
      <path d="M4 13 Q4 4 16 4 Q28 4 28 13 v3 H4 z" fill="url(#l)"/><rect x="4" y="16" width="24" height="12" rx="2" fill="#c9961f"/>
      <circle cx="16" cy="16" r="4.6" fill="#e23b3b" stroke="#1e1603" stroke-width="1.2"/><path d="M11.4 16a4.6 4.6 0 0 0 9.2 0z" fill="#fff"/><rect x="11.4" y="15.4" width="9.2" height="1.2" fill="#1e1603"/></svg>
    <h1>Pokémon <span>Chest</span></h1>
    <span class="caught-pill" id="caughtPill">—</span>
    <div class="pf"><div class="l">Deck</div><div class="v" id="pfVal">—</div></div>
  </div>

  <main>
    <!-- DECK -->
    <section class="view on" id="view-deck">
      <div id="deck-stage"></div>
      <div class="sw-info" id="sw-info"></div>
      <div class="sw-hint" id="sw-hint">← swipe →</div>
      <div class="sw-dots" id="sw-dots"></div>
    </section>

    <!-- BUILD -->
    <section class="view" id="view-build">
      <div class="scroll">
        <div class="sub">Your battle deck <span id="deckcount" style="color:var(--emerald)"></span></div>
        <div class="mydeck" id="mydeck"></div>
        <div class="sub">Caught cards — tap to add / remove</div>
        <div class="grid" id="caughtgrid"></div>
        <div class="sub">Wild — catch with a real photo to unlock</div>
        <div class="grid" id="wildgrid"></div>
      </div>
    </section>

    <!-- BATTLE -->
    <section class="view" id="view-battle">
      <div class="arena" id="arena">
        <div class="scene" id="scene">
          <div class="ring-spin"></div>
          <div class="stadium"></div>
          <div class="pile foe" id="pileFoe"></div>
          <div class="pile you" id="pileYou"></div>
        </div>
        <div class="flash" id="flash"></div>
        <div class="bt-title" id="btTitle">BATTLE!</div>
        <div class="board" id="board"></div>
      </div>
      <div class="btn-row" id="battleCtl"></div>
    </section>
  </main>

  <nav class="nav">
    <button data-nav="deck" class="on"><span class="ic">🃏</span>Deck</button>
    <button data-nav="build"><span class="ic">🛠</span>Build</button>
    <button data-nav="battle"><span class="ic">⚔️</span>Battle</button>
  </nav>
</div>

<script>
const DATA = @@MOBILE_DATA@@;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const money=n=>n==null?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIERC={legendary:'#f0c33c',epic:'#a97bff',rare:'#4cc2ff',uncommon:'#3ad6a0',common:'#8f9bb3'};
const CARDS=DATA.cards||[];
const caught=CARDS.filter(c=>c.caught), wild=CARDS.filter(c=>!c.caught);
const byId={}; CARDS.forEach(c=>byId[c.id]=c);
const LS='chestdeck.mydeck.v1';
let myDeck=[]; try{myDeck=JSON.parse(localStorage.getItem(LS))||[]}catch{}
myDeck=myDeck.filter(id=>byId[id]&&byId[id].caught);
const saveDeck=()=>{try{localStorage.setItem(LS,JSON.stringify(myDeck))}catch{}};
const emblem=`<svg class="emblem" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#4cc2ff" stroke-width="1.5" opacity=".5"/><circle cx="16" cy="16" r="5" fill="#e23b3b" stroke="#0a0e16" stroke-width="1.4"/><path d="M11 16a5 5 0 0 0 10 0z" fill="#dfe6f2"/><rect x="11" y="15.3" width="10" height="1.4" fill="#0a0e16"/></svg>`;
function ph(c){return `<div class="ph"><div class="pb"></div><div class="pn">${esc(c.name)}<br><span style="color:var(--muted2)">${esc(c.set)}</span></div></div>`;}
function imgOrPh(c){return c.img?`<img src="${c.img}" alt="">`:ph(c);}

$('#pfVal').textContent=money(DATA.portfolio);
$('#caughtPill').textContent=`${caught.length} caught`;

/* ---------- nav ---------- */
$$('.nav button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.nav;
  $$('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+v));
  if(v==='build')renderBuild();
  if(v==='battle')renderBattleIntro();
});

/* ================= DECK (swipe) ================= */
// order: caught first (playable), then wild (to-catch)
const deckOrder=[...caught,...wild];
let di=0;
function renderDeck(){
  const stage=$('#deck-stage'); if(!stage)return;
  if(!deckOrder.length){stage.innerHTML=`<div class="empty"><div class="big">🃏</div><div>No cards yet. Catch some in the Mac app’s Photo Studio.</div></div>`;$('#sw-info').innerHTML='';$('#sw-hint').textContent='';$('#sw-dots').innerHTML='';return;}
  di=(di%deckOrder.length+deckOrder.length)%deckOrder.length;
  stage.innerHTML='';
  // render up to 4 stacked (top = current)
  for(let k=Math.min(3,deckOrder.length-1);k>=0;k--){
    const c=deckOrder[(di+k)%deckOrder.length];
    const el=document.createElement('div');
    el.className='sw-card'+(c.caught?'':' wild');
    el.style.setProperty('--tc',TIERC[c.tier]||'#8f9bb3');
    el.style.transform=`translateY(${k*8}px) scale(${1-k*.05})`;
    el.style.zIndex=String(50-k);
    el.style.opacity=k>2?'0':'1';
    el.innerHTML=`${imgOrPh(c)}<div class="holo"></div><div class="tier-ring"></div>
      ${c.graded?`<div class="grade-flag">${esc(c.graded)}</div>`:''}
      <div class="lang-flag">${c.lang==='ja'?'🇯🇵':'🇺🇸'}</div>
      ${c.caught?'':`<div class="lock"><div class="lk">🔒</div><div class="lt">Wild — snap a real photo to catch</div></div>`}`;
    stage.appendChild(el);
    if(k===0)attachDrag(el);
  }
  const c=deckOrder[di];
  $('#sw-info').innerHTML=`<div class="sw-name">${esc(c.name)}</div><div class="sw-set">${esc(c.set)}${c.number?' · #'+esc(c.number):''}</div>
    <div class="sw-val">${money(c.value)}</div><span class="sw-tier" style="background:${TIERC[c.tier]}">${c.caught?c.tier:'wild'}</span>`;
  $('#sw-hint').textContent=c.caught?'← swipe →   ·   tap for holo':'← swipe →   ·   catch it to battle';
  const dots=deckOrder.length<=40?deckOrder.map((_,i)=>`<span class="sw-dot${i===di?' on':''}"></span>`).join(''):'';
  $('#sw-dots').innerHTML=dots;
}
function attachDrag(el){
  // pointer events + capture: unified touch/mouse, no leaked window listeners
  let sx=0,sy=0,drag=false;
  const holo=el.querySelector('.holo');
  el.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;el.style.transition='none';try{el.setPointerCapture(e.pointerId)}catch{}});
  el.addEventListener('pointermove',e=>{
    if(!drag){const r=el.getBoundingClientRect();holo&&holo.style.setProperty('--hx',((e.clientX-r.left)/r.width*100)+'%');return;}
    const dx=e.clientX-sx,dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    if(holo){const r=el.getBoundingClientRect();holo.style.setProperty('--hx',((e.clientX-r.left)/r.width*100)+'%');holo.style.setProperty('--hy',((e.clientY-r.top)/r.height*100)+'%');}
    e.preventDefault();
  });
  const end=e=>{
    if(!drag)return;drag=false;el.style.transition='';try{el.releasePointerCapture(e.pointerId)}catch{}
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>70){el.style.transform=`translate(${dx>0?400:-400}px,0) rotate(${dx>0?30:-30}deg)`;el.style.opacity='0';di+=dx>0?1:-1;setTimeout(renderDeck,180);}
    else{el.style.transform='';}
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

/* ================= BUILD ================= */
const DECK_MAX=6;
function renderBuild(){
  const md=$('#mydeck');
  const slots=[];
  for(let i=0;i<DECK_MAX;i++){
    const id=myDeck[i];
    if(id!=null&&byId[id]){const c=byId[id];slots.push(`<div class="mini" style="--tc:${TIERC[c.tier]}" data-rm="${c.id}">${imgOrPh(c)}<div class="x">×</div></div>`);}
    else slots.push(`<div class="slot">＋</div>`);
  }
  md.innerHTML=slots.join('');
  $('#deckcount').textContent=`${myDeck.length}/${DECK_MAX}`;
  $('#caughtgrid').innerHTML=caught.length?caught.map(c=>`
    <div class="gcard${myDeck.includes(c.id)?' sel':''}" style="--tc:${TIERC[c.tier]}" data-add="${c.id}">
      ${imgOrPh(c)}<div class="gv">${money(c.value)}</div>${myDeck.includes(c.id)?'<div class="add">✓</div>':''}
    </div>`).join(''):`<div class="reason" style="grid-column:1/-1;color:var(--muted2);font-size:13px">No caught cards yet — snap real photos in the Mac app to unlock battle cards.</div>`;
  $('#wildgrid').innerHTML=wild.slice(0,60).map(c=>`
    <div class="gcard wildcell" data-wild="1">${imgOrPh(c)}<div class="wl">🔒</div><div class="gv">${money(c.value)}</div></div>`).join('');
  $$('#caughtgrid [data-add]').forEach(el=>el.onclick=()=>toggleDeck(el.dataset.add));
  $$('#mydeck [data-rm]').forEach(el=>el.onclick=()=>toggleDeck(el.dataset.rm,true));
}
function toggleDeck(id,removeOnly){
  const c=byId[id]||byId[+id]; if(!c)return; id=c.id;   // canonical id (number) — matches stored myDeck
  const i=myDeck.indexOf(id);
  if(i>=0)myDeck.splice(i,1);
  else if(!removeOnly){if(myDeck.length>=DECK_MAX){toast('Deck full (6). Remove one first.');return;}myDeck.push(id);}
  saveDeck();renderBuild();
}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);background:#0e131e;border:1px solid var(--border2);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.5)';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',1800);}

/* ================= BATTLE ================= */
function battleDeck(){
  let d=myDeck.map(id=>byId[id]).filter(Boolean);
  if(!d.length)d=caught.slice(0,6);              // fall back to your caught cards
  if(!d.length)d=deckOrder.slice(0,6);           // demo with whatever's loaded
  return d;
}
const hasReal=()=>myDeck.length>0||caught.length>0;
function renderBattleIntro(){
  resetArena();
  const ctl=$('#battleCtl');
  if(!deckOrder.length){
    $('#arena').style.opacity='.25';ctl.innerHTML='';
    $('#board').className='board on';
    $('#board').innerHTML=`<div class="empty"><div class="big">⚔️</div><div>Nothing loaded yet.</div></div>`;
    return;
  }
  $('#arena').style.opacity='1';
  const real=hasReal();
  ctl.innerHTML=`<button class="btn blue" id="startBtn">${real?'⚔️ Start Battle Buildup':'▶ Demo the battle buildup'}</button>`
    +(real?'':`<div class="reason" style="width:100%;text-align:center;margin-top:2px">Catch cards with real photos to battle for real 📸</div>`);
  $('#startBtn').onclick=runBuildup;
}
let _bt=[],_btRunning=false;
const btAdd=(fn,ms)=>{const id=setTimeout(fn,ms);_bt.push(id);return id;};
function clearBt(){_bt.forEach(clearTimeout);_bt=[];}
function resetArena(){
  clearBt();_btRunning=false;
  $('#board').className='board';$('#board').innerHTML='';
  $('#btTitle').style.opacity='0';$('#flash').style.opacity='0';
  const sc=$('#scene');sc.style.transition='none';sc.style.transform='rotateY(0deg)';
  $('#pileYou').style.transform='translateX(-50%) translateZ(60px) translateY(120%)';
  $('#pileFoe').style.transform='translateX(-50%) translateZ(-40px) rotate(180deg) translateY(120%)';
  const backs=n=>Array.from({length:n},(_,i)=>`<div class="pc" style="transform:translateZ(${i*2}px) translateY(${-i*1.2}px)">${emblem}</div>`).join('');
  $('#pileYou').innerHTML=backs(6);$('#pileFoe').innerHTML=backs(6);
}
function runBuildup(){
  if(_btRunning)return;                    // ignore double-taps
  resetArena(); _btRunning=true;
  const d=battleDeck(); $('#battleCtl').innerHTML='';
  const you=$('#pileYou'),foe=$('#pileFoe'),sc=$('#scene');
  requestAnimationFrame(()=>{
    sc.style.transition='transform 3.4s cubic-bezier(.4,0,.2,1)';
    sc.style.transform='rotateY(-26deg)';                 // camera swirl
    you.style.transition=foe.style.transition='transform 1s cubic-bezier(.3,.9,.3,1)';
    you.style.transform='translateX(-50%) translateZ(60px) translateY(0)';
    foe.style.transform='translateX(-50%) translateZ(-40px) rotate(180deg) translateY(0)';
  });
  btAdd(()=>{ // swirl back the other way + piles ease toward center
    sc.style.transform='rotateY(20deg)';
    you.style.transform='translateX(-50%) translateZ(60px) translateY(-34%)';
    foe.style.transform='translateX(-50%) translateZ(-40px) rotate(180deg) translateY(-34%)';
  },1400);
  btAdd(()=>{ // CLASH
    const f=$('#flash');f.style.transition='opacity .12s';f.style.opacity='1';
    navigator.vibrate&&navigator.vibrate(30);
    btAdd(()=>{f.style.transition='opacity .6s';f.style.opacity='0';},130);
    const t=$('#btTitle');t.style.transition='opacity .3s,transform .5s';t.style.opacity='1';t.style.transform='scale(1.15)';
    btAdd(()=>{t.style.opacity='0';},900);
  },2600);
  btAdd(()=>{ sc.style.transition='transform 1s ease';sc.style.transform='rotateY(0deg)'; _btRunning=false; showBoard(d); },3300);
}
function showBoard(d){
  const mine=d[Math.floor(Math.random()*d.length)];
  const foePool=(caught.length>1?caught:CARDS);
  const foe=foePool[Math.floor(Math.random()*foePool.length)];
  const b=$('#board');b.className='board on';
  b.innerHTML=`
    <div style="text-align:center"><div class="blabel">Opponent</div><div class="bcard" style="--tc:${TIERC[foe.tier]}">${imgOrPh(foe)}</div></div>
    <div class="bmid"><div class="vs">VS</div><div class="coin" id="coin">🪙</div><div class="result" id="res">Flip to see who leads</div></div>
    <div style="text-align:center"><div class="bcard" style="--tc:${TIERC[mine.tier]}">${imgOrPh(mine)}</div><div class="blabel" style="margin-top:6px">Your lead — ${esc(mine.name)}</div></div>`;
  $('#battleCtl').innerHTML=`<button class="btn" id="flipBtn">🪙 Flip & reveal</button><button class="btn ghost" id="againBtn">↺ Rebuild</button>`;
  $('#againBtn').onclick=renderBattleIntro;
  $('#flipBtn').onclick=()=>{
    const coin=$('#coin');coin.classList.remove('flip');void coin.offsetWidth;coin.classList.add('flip');
    navigator.vibrate&&navigator.vibrate(20);
    const youFirst=Math.random()<0.5;
    // playful "power" from value + tier
    const pw=c=>(c.value||1)*(1+['common','uncommon','rare','epic','legendary'].indexOf(c.tier)*.15);
    setTimeout(()=>{
      const win=pw(mine)>=pw(foe);
      $('#res').innerHTML=`${youFirst?'You go first! ':'Opponent starts. '}<br><b style="color:${win?'var(--emerald)':'var(--red)'}">${win?'Your card leads 💪':'Tough matchup'}</b>`;
    },1100);
  };
}

renderDeck();
window.addEventListener('resize',()=>{if($('#view-deck').classList.contains('on'))renderDeck();});
</script>
</body>
</html>
