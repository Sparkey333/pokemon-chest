<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pokémon Den</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e16;color:#93a3be;
    font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;-webkit-user-select:none}
  .wrap{text-align:center}
  .chest{font-size:56px;animation:bob 1.2s ease-in-out infinite}
  h1{color:#e8eef8;font-size:20px;margin:14px 0 4px;letter-spacing:-.01em}
  h1 span{color:#ffce4d}
  p{font-size:13px;margin:0;color:#6c7c98}
  .bar{width:180px;height:4px;border-radius:2px;background:#1f2a40;margin:18px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#ffce4d,#4cc2ff);
    animation:slide 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="chest">🧰</div>
    <h1>Pokémon <span>Chest</span></h1>
    <p>Opening the chest…</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
