name: Build macOS DMG

# Builds "Pokemon Chest.app" + the .dmg on GitHub's macOS runners, then
# publishes a rolling dmg-latest release (DMG + source zip) on the Releases page.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/card-scan-codex-8306
      - claude/pokemon-chest-redesign-31io2c
    paths:
      - "src-tauri/**"
      - "assets/**"
      - "data/**"
      - "tauri-shell/**"
      - "index.html"
      - "server.py"
      - "icon-source.png"
      - "package.json"
      - ".github/workflows/build-dmg.yml"

permissions:
  contents: write

concurrency:
  group: chest-latest
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Regenerate the full icon set from icon-source.png
        run: npx --yes "@tauri-apps/cli@^2" icon icon-source.png

      # CI has no Apple Developer certificate — ad-hoc sign ("-") instead of the
      # configured identity. First launch needs right-click → Open (Gatekeeper).
      - name: Build app + dmg (universal, ad-hoc signed)
        run: >
          npx --yes "@tauri-apps/cli@^2" build
          --target universal-apple-darwin
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Zip the source tree (tracked files at this commit)
        run: |
          git archive --format=zip -o "PokemonChest-source-${GITHUB_SHA:0:7}.zip" "$GITHUB_SHA"
          # stable name for the GET-POKEMON-CHEST.html download button
          cp "PokemonChest-source-${GITHUB_SHA:0:7}.zip" PokemonChest-source-latest.zip
          ls -lh PokemonChest-source-*.zip

      # Dedicated tag so the redesign "dmg-latest" (Pokémon Den) cannot overwrite Chest.
      - name: Publish DMG + source to chest-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          SRC_HASH="PokemonChest-source-${GITHUB_SHA:0:7}.zip"
          SRC_LATEST=PokemonChest-source-latest.zip
          GUIDE=GET-POKEMON-CHEST.html
          test -f "$DMG" && test -f "$SRC_HASH" && test -f "$SRC_LATEST" && test -f "$GUIDE"
          echo "publishing: $DMG + $SRC_HASH + $SRC_LATEST + $GUIDE"
          NOTES="Pokémon Chest v1.14.0 — commit ${GITHUB_SHA:0:7}. Open GET-POKEMON-CHEST.html for one-page download/build steps. Ad-hoc signed: right-click app → Open on first launch."
          gh release delete chest-latest --cleanup-tag --yes || true
          gh release create chest-latest "$DMG" "$SRC_HASH" "$SRC_LATEST" "$GUIDE" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Pokémon Chest — latest macOS build + source" \
            --notes "$NOTES"

      - name: Upload the dmg as a workflow artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Pokemon-Chest-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            GET-POKEMON-CHEST.html
          if-no-files-found: error
          retention-days: 14
