name: Build macOS DMG

# Builds "Pokemon Den.app" + the styled .dmg on GitHub's macOS machines,
# so a fresh installer is downloadable without building on your own Mac.
# Runs on every push to the redesign branch, or on demand (Run workflow).
on:
  workflow_dispatch:
    inputs:
      public_art:
        description: "Public build: ship with NO external catalog card art (user-scanned art only)"
        type: boolean
        default: false
      ship_build:
        description: "Store build: strip App-Store-blocking features (removes the Emerald Lab and 404s its routes)"
        type: boolean
        default: false
  push:
    branches: [claude/pokemon-chest-redesign-31io2c, main]
    paths:
      - "src-tauri/**"
      - "assets/**"
      - "data/**"
      - "tauri-shell/**"
      - "index.html"
      - "server.py"
      - "icon-source.png"
      - ".github/workflows/build-dmg.yml"

permissions:
  contents: write   # lets the job publish the dmg as a release asset

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Merge, never overwrite: writing a fresh object here used to drop every
      # other flag in the file, so a public-art dispatch silently turned
      # shipBuild off — which is how an App-Store-blocking panel gets into a
      # store build.
      - name: Apply build-profile flags
        if: ${{ inputs.public_art == true || inputs.ship_build == true }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/build-flags.json")
          flags = json.loads(p.read_text()) if p.exists() else {}
          if "${{ inputs.public_art }}" == "true":
              flags["publicArt"] = True
          if "${{ inputs.ship_build }}" == "true":
              flags["shipBuild"] = True
          p.write_text(json.dumps(flags, indent=2) + "\n")
          print("build flags:", flags)
          PY

      - name: Regenerate the full icon set from icon-source.png
        run: npx --yes "@tauri-apps/cli@^2" icon icon-source.png

      # CI has no Apple Developer certificate — ad-hoc sign ("-") instead of the
      # configured identity. First launch needs right-click -> Open (Gatekeeper).
      - name: Build app + dmg (universal, ad-hoc signed)
        run: >
          npx --yes "@tauri-apps/cli@^2" build
          --target universal-apple-darwin
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      # Primary delivery: a rolling "dmg-latest" release — release assets do NOT
      # count against the Actions artifact-storage quota (which is what failed
      # on run #1). Download from the repo's Releases page.
      - name: Zip the source tree (tracked files at this commit)
        run: |
          git archive --format=zip -o "PokemonDen-source-${GITHUB_SHA:0:7}.zip" "$GITHUB_SHA"
          ls -lh PokemonDen-source-*.zip

      # An unsigned download people are told to right-click past Gatekeeper is
      # exactly the download that most needs a checksum to verify against.
      - name: Checksum the release assets
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          SRC=$(ls PokemonDen-source-*.zip)
          shasum -a 256 "$DMG" "$SRC" | sed 's#.*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the dmg + source zip to the dmg-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          SRC=$(ls PokemonDen-source-*.zip)
          SUM=$(awk '{print $1}' SHA256SUMS.txt | head -1)
          echo "publishing: $DMG  +  $SRC"
          gh release delete dmg-latest --cleanup-tag --yes || true
          gh release create dmg-latest "$DMG" "$SRC" SHA256SUMS.txt OPEN-ANYWAY.command \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Pokémon Den — latest macOS build + source" \
            --notes "$(printf '%s\n' \
              "Universal (Apple Silicon + Intel) build of commit ${GITHUB_SHA:0:7}." \
              "" \
              "**First launch** — the build is ad-hoc signed, not notarized, so macOS will say it \"can't be verified\". Any one of these clears it:" \
              "1. Download \`OPEN-ANYWAY.command\` below and double-click it, or" \
              "2. Right-click the app → **Open**, or" \
              "3. System Settings → Privacy & Security → **Open Anyway**" \
              "" \
              "**Verify the download:**" \
              '```' \
              "shasum -a 256 -c SHA256SUMS.txt" \
              '```' \
              "dmg sha256: \`${SUM}\`")"

      # Best-effort secondary copy; skipped gracefully while the artifact
      # storage quota is exhausted.
      - name: Upload the dmg as a workflow artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Pokemon-Chest-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
