<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokémon Chest — Collection &amp; Price Tracker</title>
<link rel="stylesheet" href="assets/styles.css" />
<link rel="stylesheet" href="assets/revamp.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 13Q4 4 16 4q12 0 12 9v3H4z' fill='%23ffce4d'/%3E%3Crect x='4' y='16' width='24' height='12' rx='2' fill='%23c9961f'/%3E%3Crect x='9' y='4.8' width='3' height='23.2' fill='%236b4f12'/%3E%3Crect x='20' y='4.8' width='3' height='23.2' fill='%236b4f12'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e23b3b' stroke='%231e1603' stroke-width='1.4'/%3E%3Cpath d='M11 16a5 5 0 0 0 10 0z' fill='%23fff'/%3E%3Crect x='11' y='15.3' width='10' height='1.4' fill='%231e1603'/%3E%3Ccircle cx='16' cy='16' r='1.7' fill='%23fff' stroke='%231e1603' stroke-width='1.1'/%3E%3C/svg%3E" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="chest-logo" viewBox="0 0 32 32" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="chestLid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd96a"/><stop offset="1" stop-color="#e7af2c"/>
        </linearGradient>
        <linearGradient id="chestBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d8a72e"/><stop offset="1" stop-color="#b8881a"/>
        </linearGradient>
      </defs>
      <path d="M4 13 Q4 4 16 4 Q28 4 28 13 v3 H4 z" fill="url(#chestLid)"/>
      <rect x="4" y="16" width="24" height="12" rx="2" fill="url(#chestBase)"/>
      <rect x="4" y="15.2" width="24" height="1.6" fill="#8a6f25"/>
      <rect x="9" y="4.8" width="3" height="23.2" rx="1" fill="#6b4f12"/>
      <rect x="20" y="4.8" width="3" height="23.2" rx="1" fill="#6b4f12"/>
      <circle cx="16" cy="16" r="4.8" fill="#e23b3b" stroke="#1e1603" stroke-width="1.3"/>
      <path d="M11.2 16 a4.8 4.8 0 0 0 9.6 0 z" fill="#f4f0e4"/>
      <rect x="11.2" y="15.35" width="9.6" height="1.3" fill="#1e1603"/>
      <circle cx="16" cy="16" r="1.6" fill="#f4f0e4" stroke="#1e1603" stroke-width="1"/>
    </svg>
    <div>
      <h1>Pokémon <span>Chest</span></h1>
      <p class="tagline">Your collection · live comps · sell &amp; grade intelligence</p>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search your collection — name, set, number…" autocomplete="off" />
  </div>
  <div class="topbar-right">
    <div class="value-pill" id="valuePill" title="Total market value of your collection">
      <span class="vp-label">Portfolio</span>
      <span class="vp-value" id="vpValue">—</span>
    </div>
    <button class="btn ghost" id="refreshBtn" title="Re-read the data file and record a new price snapshot">↻ Refresh</button>
    <button class="btn ghost" id="helpBtn" title="How it works — the first-run walkthrough">？ Guide</button>
    <button class="btn ghost" id="settingsBtn" title="Connect live data &amp; AI (your own API keys)">⚙ Live</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="dashboard" class="tab active">📊 Dashboard</button>
  <button data-view="collection" class="tab">🗂 Collection</button>
  <button data-view="ledger" class="tab">➕ Add &amp; Sold</button>
  <button data-view="scan" class="tab">📷 Scanner</button>
  <button data-view="den" class="tab">🏠 The Den</button>
  <button data-view="studio3d" class="tab">🧊 3D Studio</button>
  <button data-view="best" class="tab">💰 Best Sellers</button>
  <button data-view="brand" class="tab">🏷 Brand Lab</button>
  <button data-view="case" class="tab">🏛 Display Case</button>
  <button data-view="sell" class="tab">💵 Sell Hub</button>
  <button data-view="lab" class="tab">🧪 Grade Lab</button>
  <button data-view="submit" class="tab">📮 Submit</button>
  <button data-view="guide" class="tab">📖 Sell &amp; Grade Guide</button>
  <button data-view="merch" class="tab">🧢 Merch Vault</button>
  <button data-view="arcade" class="tab">🕹 Arcade</button>
  <button data-view="admin" class="tab">🛠 Admin</button>
</nav>

<main id="main">
  <section id="view-dashboard" class="view active"></section>
  <section id="view-arcade" class="view"></section>
  <section id="view-collection" class="view">
    <div class="toolbar" id="collectionToolbar"></div>
    <div id="grid" class="grid"></div>
    <div id="gridSentinel" class="sentinel"></div>
    <p id="gridEmpty" class="empty" hidden>No cards match your filters.</p>
  </section>
  <section id="view-case" class="view"></section>
  <section id="view-sell" class="view"></section>
  <section id="view-guide" class="view"></section>
  <section id="view-merch" class="view"></section>
  <section id="view-lab" class="view"></section>
  <section id="view-submit" class="view"></section>
  <section id="view-admin" class="view"></section>
  <section id="view-ledger" class="view"></section>
  <section id="view-scan" class="view"></section>
  <section id="view-den" class="view"></section>
  <section id="view-studio3d" class="view"></section>
  <section id="view-best" class="view"></section>
  <section id="view-brand" class="view"></section>
</main>

<div id="modalRoot"></div>

<footer class="footer">
  <span id="footMeta">—</span>
  <span class="dot">·</span>
  Images: <a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a> (free, EN+JA)
  <span class="dot">·</span>
  Prices: your PriceCharting export
  <span class="dot">·</span>
  <span class="muted">Comp links open live data on eBay / TCGplayer / Mercari. Not financial advice.</span>
</footer>

<script src="assets/app.js"></script>
<script src="assets/revamp.js"></script>
</body>
</html>
